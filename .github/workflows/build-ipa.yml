name: Build iosdm IPA

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned iOS & iPadOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Universal and iPhone IPAs
        run: |
          chmod +x scripts/build_ipa.sh
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IOSDM_VERSION="${TAG_VER}" ./scripts/build_ipa.sh
          else
            ./scripts/build_ipa.sh
          fi

      - name: Verify IPA archives
        run: |
          unzip -t dist/iosdm.ipa
          unzip -t dist/iosdm-iPhone.ipa
          shasum -a 256 dist/iosdm.ipa dist/iosdm-iPhone.ipa dist/version.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosdm-ipas
          path: |
            dist/iosdm.ipa
            dist/iosdm-iPhone.ipa
            dist/version.json

      - name: Attach IPAs to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/iosdm.ipa dist/iosdm-iPhone.ipa dist/version.json --clobber
          else
            gh release create "${TAG}" dist/iosdm.ipa dist/iosdm-iPhone.ipa dist/version.json \
              --title "iosdm ${TAG}" \
              --notes "自动构建产物：包含通用版 iosdm.ipa（iPhone + iPad，iOS 15.0+）、iPhone 专用版 iosdm-iPhone.ipa 与 version.json（未签名 arm64）。"
          fi
